name: LakayGoPay regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Node ESM for Cloudflare Pages Functions
        run: printf '%s' '{"private":true,"type":"module"}' > package.json
      - name: Run backend and frontend contract tests
        run: node --test tests/transfers.test.mjs tests/agent-card-readiness.test.mjs
