name: LakayGoPay regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Node ESM for Cloudflare Pages Functions
        run: printf '%s' '{"private":true,"type":"module"}' > package.json
      - name: Run backend and frontend contract tests
        run: >-
          node --check functions/api/auth/register.js &&\
          node --check functions/_shared/admin-trusted-device.js &&
          node --check functions/_shared/security.js &&
          node --check functions/_shared/admin-pin.js &&
          node --check functions/api/admin/mfa/trust.js &&
          node --check functions/_middleware.js &&
          node --check functions/_shared/system-logs.js &&
          node --check functions/api/admin/logs.js &&
          node --check functions/api/logs/client.js &&
          node --check public/observability.js &&
          node --check public/app.js &&
          node --check public/admin/admin.js &&
          node --test tests/transfers.test.mjs tests/agent-card-readiness.test.mjs tests/observability.test.mjs tests/admin-mfa-button.test.mjs tests/signup-pin-first.test.mjs
