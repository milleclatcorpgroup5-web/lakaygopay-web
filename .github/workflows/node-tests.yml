name: LakayGoPay regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Node ESM for Cloudflare Pages Functions
        run: printf '%s' '{"private":true,"type":"module"}' > package.json
      - name: Verify imports, JavaScript syntax, and regression contracts
        run: |
          set -e
          node scripts/verify-imports.mjs
          find functions public tests scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --test tests/ledger-audit-contract.test.mjs tests/transaction-integrity-audit-contract.test.mjs tests/transfers.test.mjs tests/wallets.test.mjs tests/frontend-contracts.test.mjs tests/personal-receive.test.mjs tests/merchant-qr.test.mjs tests/agent-card-readiness.test.mjs tests/observability.test.mjs tests/admin-mfa-button.test.mjs tests/signup-pin-first.test.mjs
